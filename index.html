n);color:#fff}.date-row{display:flex;align-items:center;gap:9px;margin-bottom:18px}.date-row button{border:0;background:transparent;width:32px;height:32px;border-radius:9px;color:var(--muted);font-size:20px}.date-row button:hover{background:var(--soft)}.date-pill{background:var(--ink);color:#fff;border-radius:11px;padding:9px 16px;font-size:13px;font-weight:600}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-left:auto}.legend span{display:flex;align-items:center;gap:6px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sage);border:1px solid #c7d8cc}.dot.booked{background:var(--orange);border-color:var(--orange)}.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.slot{border:1px solid var(--line);background:#fbfcfa;border-radius:13px;padding:13px 12px;text-align:left;min-height:74px;transition:.2s}.slot:hover:not(:disabled){border-color:var(--green);transform:translateY(-1px)}.slot .time{font-size:14px;font-weight:700}.slot .status{font-size:11px;margin-top:8px;color:var(--green)}.slot.booked{background:var(--orange-bg);border-color:#f5b58d;color:#a34f22}.slot.booked .status{color:#c76b39}.slot.selected{background:var(--green);border-color:var(--green);color:#fff}.slot.selected .status{color:#dcf3e4}.slot:disabled{cursor:not-allowed}.hint{margin-top:16px;padding:11px 13px;background:#f8faf7;border-radius:11px;color:var(--muted);font-size:12px;line-height:1.55}.summary{background:#f5f8f4;border-radius:16px;padding:16px;margin-bottom:20px}.summary-row{display:flex;justify-content:space-between;gap:16px;font-size:13px;padding:9px 0;border-bottom:1px solid #e1e9e1}.summary-row:last-child{border:0;padding-bottom:0}.summary-row:first-child{padding-top:0}.summary-label{color:var(--muted)}.summary-value{font-weight:600;text-align:right}.form-group{margin-bottom:17px}.form-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:8px}.required{color:#bd633b;font-size:11px;font-weight:500}.textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;color:var(--ink);outline:none;min-height:84px;resize:vertical}.textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(79,131,106,.12)}.assist-row{display:flex;gap:9px}.assist-option{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}.assist-option:has(input:checked){border-color:var(--green);background:#eff7f1;color:var(--green)}.assist-option input{accent-color:var(--green)}.reason-wrap{display:none}.reason-wrap.show{display:block}.actions{display:flex;gap:10px;margin-top:22px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:13px}.btn.primary{flex:1;background:var(--green);color:#fff}.btn.primary:hover{background:#3d6f57}.btn.ghost{background:var(--soft);color:var(--green)}.notice{display:none;margin-top:13px;padding:11px 13px;border-radius:11px;background:#eaf6ed;color:#3d7451;font-size:12px}.notice.show{display:block}.recent{margin-top:22px}.recent h3{margin-bottom:12px}.request-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;font-size:13px}.request-item:last-child{border-bottom:0}.request-item small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.tag{padding:5px 8px;border-radius:7px;background:#fff0e5;color:#b96331;font-size:11px;white-space:nowrap;height:max-content}.tag.pending{background:#eef3ed;color:#5d8068}@media(max-width:800px){.app{padding:18px 15px 36px}.hero{padding:22px;display:block}.hero h2{font-size:28px}.hero-meta{margin-top:20px}.layout{grid-template-columns:1fr}.slot-grid{grid-template-columns:repeat(3,1fr)}.legend{margin-left:0;margin-top:11px}.panel{padding:19px}}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.day{border:1px solid var(--line);background:#fbfcfa;border-radius:9px;min-height:40px;padding:6px;text-align:center;font-size:12px}.day.empty{border-color:transparent;background:transparent}.day.weekend{color:#b6bdb7;background:#f4f6f3;cursor:not-allowed}.day.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}.day.has-booking{box-shadow:inset 0 -3px 0 var(--orange)}.slot.booked{cursor:pointer}.slot.booked:hover{background:#ffe6d4;border-color:#eb8d54}.booking-detail{display:none;margin-top:16px;padding:15px;background:#fff5ec;border:1px solid #f4d2bb;border-radius:13px;font-size:13px;line-height:1.65}.booking-detail.show{display:block}.booking-detail strong{display:block;margin-bottom:7px;color:#9c4d22}.booking-detail p{margin:4px 0;color:#674b3b}.request-actions{display:flex;gap:7px;margin-top:9px}.request-actions button{border:0;border-radius:8px;padding:6px 9px;font-size:11px;background:var(--soft);color:var(--green)}.request-actions button.cancel{background:#fff0e5;color:#a34f22}.request-item.is-cancelled{opacity:.62}.request-item.is-cancelled .tag{background:#f0f1ef;color:#747a75}
    body{background:linear-gradient(#dff3df 0,#f2f8df 340px,#f8f3dd 100%);background-attachment:fixed}.app{position:relative}.app:before,.app:after{position:fixed;z-index:-1;bottom:0;font-size:78px;opacity:.38;pointer-events:none}.app:before{content:'🌲🌳🌿';left:1vw}.app:after{content:'🌿🌳🌲';right:1vw}.topbar{background:#fffdf1;border:3px solid #8bb478;border-radius:22px;padding:13px 18px;box-shadow:0 6px 0 #b6d39a}.mark{background:#4e8a58;border:3px solid #fff4bb;border-radius:50%;box-shadow:0 4px 0 #30683c;font-size:15px}.brand h1{color:#315e3c}.brand p{color:#718763}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#bfe3a8,#e9f4bd);border:3px solid #75a867;border-radius:30px;box-shadow:0 8px 0 #a2c78b}.hero:after{content:'🌳  🐿️  🍄';position:absolute;right:22px;top:18px;font-size:30px;letter-spacing:5px}.hero h2{color:#285437;text-shadow:0 2px #fff8ca}.eyebrow{color:#547f42}.panel{background:#fffdf2;border:3px solid #97b97a;border-radius:26px;box-shadow:0 8px 0 #c6d9a4}.panel h3{color:#315e3c}.studio-tab{background:#f3f8d9;border:2px solid #a9c990;border-radius:16px}.studio-tab.active{background:#4f8755;border-color:#35663d;box-shadow:0 4px 0 #2f6038}.date-pill{background:#4e7748;border:2px solid #315e3c;border-radius:16px;box-shadow:0 3px 0 #315e3c}.day{background:#fbf9df;border:2px solid #d1dfaa;border-radius:12px}.day:hover:not(:disabled){background:#e6f3c8}.day.active{background:#508657;border-color:#315e3c;box-shadow:0 3px 0 #315e3c}.day.has-booking{box-shadow:inset 0 -4px 0 #e7644a}.slot{background:#f9f7da;border:2px solid #cada9c;border-radius:17px;box-shadow:0 3px 0 #dbe5b7}.slot:hover:not(:disabled){border-color:#659a60}.slot.selected{background:#57905d;border-color:#35663d;box-shadow:0 4px 0 #315e3c}.slot.booked{background:#ffe0cf;border-color:#e56e54;box-shadow:0 3px 0 #e3a28b;color:#9c3f2d}.summary,.hint{background:#edf5d6;border:2px dashed #a7c487;border-radius:18px}.textarea,.assist-option{border:2px solid #bdd09f;border-radius:15px;background:#fffef4}.assist-option:has(input:checked){background:#e4f3cd;border-color:#5b925c}.btn{border-radius:16px}.btn.primary{background:#4f8755;box-shadow:0 4px 0 #315e3c}.btn.ghost{background:#e8f1cf}.booking-detail{background:#fff2d2;border:2px solid #e4a46e;border-radius:17px}.request-item{background:#f8f7df;border:2px solid #d7e2b2;border-radius:17px;padding:13px;margin-bottom:9px}.request-item.is-cancelled{opacity:1;background:#edf6df;border-style:dashed}.request-item.is-cancelled small:after{content:' · 该时段现已恢复可预约';color:#4f8755;font-weight:600}.request-item.is-cancelled .tag{background:#dceecd;color:#397044}.notice{border:2px solid #9dc48a;border-radius:15px}.recent h3:before{content:'🦊 ';}.panel-head h3:before{content:'🌿 ';}
    .syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}.sync-state{font-size:12px;color:#537050;background:#edf6df;padding:7px 10px;border-radius:12px}.staff-login{display:flex;gap:7px}.staff-login input{width:145px;border:2px solid #bdd09f;border-radius:11px;padding:7px 9px;background:#fffef4}.staff-login button{border:0;border-radius:11px;padding:7px 10px;background:#4f8755;color:#fff}.staff-only{display:none}.is-staff .staff-only{display:inline-block}
    @media(max-width:800px){.hero:after{opacity:.35}.app:before,.app:after{display:none}.topbar{align-items:flex-start;gap:12px;flex-wrap:wrap}.syncbar{margin-left:0}.staff-login input{width:125px}}
    @media(max-width:420px){.slot-grid{grid-template-columns:repeat(2,1fr)}.topbar{margin-bottom:18px}.user span{display:none}.day{min-height:35px;padding:4px}.hero:after{display:none}}

</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="mark">18</div><div><h1>18楼无影棚</h1><p>影棚预约管理</p></div></div><div class="syncbar"><span class="sync-state" id="syncState">正在连接共享数据…</span><form class="staff-login" id="staffLogin"><input id="staffPassword" type="password" placeholder="工作人员密码" required><button type="submit">工作人员登录</button></form><button class="staff-only" id="staffLogout" type="button">退出登录</button></div></header>
    <section class="hero"><div><div class="eyebrow">STUDIO BOOKING</div><h2>18楼无影棚预约</h2><p>三个影棚均可独立预约，选择影棚、日期与时间段即可提交申请。</p></div><div class="hero-meta"><div class="meta-item">今日开放<strong>09:00—22:00</strong></div><div class="meta-item">可预约影棚<strong>共 3 个</strong></div></div></section>
    <div class="layout">
      <section class="panel"><div class="panel-head"><div><h3>选择影棚与时间段</h3><p class="sub">全年日历开放，周一至周五可预约</p></div><div class="legend"><span><i class="dot"></i>空闲</span><span><i class="dot booked"></i>已预约</span></div></div><div class="studio-tabs" id="studioTabs"></div><div class="date-row"><button id="prev" aria-label="上个月">‹</button><div class="date-pill" id="dateLabel">2026年10月</div><button id="next" aria-label="下个月">›</button></div><div class="calendar" id="calendar"></div><div class="slot-grid" id="slotGrid"></div><div class="booking-detail" id="bookingDetail" aria-live="polite"></div><div class="hint">选择工作日和空闲时间段后即可预约成功，单次最长可预约 6 小时。</div><div class="recent"><h3>我的预约</h3><div id="recentList"></div></div></section>
      <section class="panel"><div class="panel-head"><div><h3>填写申请</h3><p class="sub">请确认信息后提交预约申请</p></div></div><div class="summary"><div class="summary-row"><span class="summary-label">预约影棚</span><span class="summary-value" id="summaryStudio">实景棚无影棚</span></div><div class="summary-row"><span class="summary-label">预约日期</span><span class="summary-value" id="summaryDate">10月26日 · 周一</span></div><div class="summary-row"><span class="summary-label">预约时段</span><span class="summary-value" id="summaryTime">尚未选择</span></div></div><form id="bookingForm"><div class="form-group"><div class="form-label">是否需要现场助理 <span class="required">可选</span></div><div class="assist-row"><label class="assist-option"><input type="radio" name="assistant" value="no" checked> 不需要</label><label class="assist-option"><input type="radio" name="assistant" value="yes"> 需要助理</label></div></div><div class="form-group reason-wrap" id="reasonWrap"><label class="form-label" for="reason">申请原因 <span class="required">需要填写</span></label><textarea id="reason" class="textarea" placeholder="请说明需要助理协助的具体工作，例如：灯光调整、器材搬运…"></textarea></div><div class="form-group"><label class="form-label" for="note">备注 <span class="required">可选</span></label><textarea id="note" class="textarea" placeholder="可补充人数、器材需求等信息"></textarea></div><div class="actions"><button class="btn ghost" type="button" id="clearBtn">清空</button><button class="btn primary" type="submit">提交预约申请</button></div><div class="notice" id="notice" aria-live="polite"></div></form></section>
    </div>
  </main>
  <script>
    const studios=[{name:'实景棚无影棚'},{name:'1806无影棚'},{name:'1801无影棚'}];
    const slots=['09:00—10:00','10:00—11:00','11:00—12:00','12:00—13:00','13:00—14:00','14:00—15:00','15:00—16:00','16:00—17:00','17:00—18:00','18:00—19:00','19:00—20:00','20:00—21:00'];
    let selectedDate=new Date(2026,9,26),studioIndex=0,selected=[],editingIndex=null,cloudBookings=[],staffPassword='',isStaff=false; const grid=document.getElementById('slotGrid');
    const cloudReady=location.protocol.startsWith('http');
    const getBookings=()=>cloudReady?cloudBookings:JSON.parse(localStorage.getItem('studioBookings')||'[]');
    function dbDate(d){return dateKey(d)}
    function fromRow(r){const d=new Date(r.booking_date+'T12:00:00');return{id:r.id,studio:r.studio,date:fullDate(d),dateKey:r.booking_date,slots:r.slots||[],time:(r.slots||[]).map(i=>slots[i]).join('、'),assistant:r.assistant,reason:r.reason||'',note:r.note||'',cancelled:r.status==='cancelled'} }
    async function api(path,options={}){const headers={'content-type':'application/json',...(options.headers||{})};if(staffPassword)headers['x-staff-password']=staffPassword;const response=await fetch(path,{...options,headers});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data}
    async function loadCloud(){try{cloudBookings=(await api('/api/bookings')).map(fromRow);setSync('共享数据已同步');render()}catch(error){setSync('同步失败：'+error.message,true)}}
    function setSync(text,error=false){const el=document.getElementById('syncState');el.textContent=text;el.style.color=error?'#9c3f2d':'#397044';el.style.background=error?'#ffe0cf':'#edf6df'}
    async function initCloud(){if(!cloudReady){setSync('本地预览模式；部署到 Worker 后自动同步',true);return}await loadCloud();setInterval(loadCloud,15000)}
    function applyStaff(value){isStaff=value;document.body.classList.toggle('is-staff',isStaff);document.getElementById('staffLogin').style.display=isStaff?'none':'flex';document.getElementById('staffLogout').style.display=isStaff?'inline-block':'none';if(isStaff)setSync('工作人员模式 · 数据同步')}
    function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
    function fullDate(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}
    function renderCalendar(){const cal=document.getElementById('calendar'),y=selectedDate.getFullYear(),m=selectedDate.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();cal.innerHTML=['日','一','二','三','四','五','六'].map(x=>'<div class="weekday">'+x+'</div>').join('')+'<div class="day empty"></div>'.repeat(first);for(let n=1;n<=count;n++){const d=new Date(y,m,n),weekend=d.getDay()===0||d.getDay()===6,active=dateKey(d)===dateKey(selectedDate),has=getBookings().some(x=>!x.cancelled&&x.studio===studios[studioIndex].name&&x.date===fullDate(d));cal.innerHTML+='<button type="button" class="day '+(weekend?'weekend ':'')+(active?'active ':'')+(has?'has-booking':'')+'" data-date="'+dateKey(d)+'" '+(weekend?'disabled':'')+'>'+n+'</button>'}cal.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const p=b.dataset.date.split('-').map(Number);selectedDate=new Date(p[0],p[1]-1,p[2]);selected=[];render()})}
    function bookingSlots(booking){if(Array.isArray(booking.slots))return booking.slots;const found=[];String(booking.time||'').split('、').forEach(part=>{const exact=slots.indexOf(part);if(exact>=0){found.push(exact);return}const [start,end]=part.split('—'),a=slots.findIndex(x=>x.startsWith(start)),z=slots.findIndex(x=>x.endsWith(end));if(a>=0&&z>=a)for(let i=a;i<=z;i++)found.push(i)});return [...new Set(found)]}
    function render(){const studio=studios[studioIndex],dayDate=fullDate(selectedDate),all=getBookings(),dayBookings=all.map((x,index)=>({x,index})).filter(v=>!v.x.cancelled&&v.x.studio===studio.name&&v.x.date===dayDate),booked=new Set(dayBookings.filter(v=>v.index!==editingIndex).flatMap(v=>bookingSlots(v.x)));document.getElementById('dateLabel').textContent=selectedDate.getFullYear()+'年'+(selectedDate.getMonth()+1)+'月';document.getElementById('summaryDate').textContent=dayDate;document.getElementById('summaryStudio').textContent=studio.name;document.getElementById('studioTabs').innerHTML=studios.map((s,i)=>'<button class="studio-tab '+(i===studioIndex?'active':'')+'" type="button" data-studio="'+i+'">'+s.name+'</button>').join('');document.querySelectorAll('[data-studio]').forEach(btn=>btn.onclick=()=>{studioIndex=Number(btn.dataset.studio);selected=[];hideBookingDetail();render()});renderCalendar();grid.innerHTML='';slots.forEach((time,i)=>{const b=booked.has(i),btn=document.createElement('button');btn.className='slot'+(b?' booked':'')+(selected.includes(i)?' selected':'');btn.setAttribute('aria-label',time+(b?'，已预约，点击查看申请原因':'，空闲'));btn.innerHTML='<div class="time">'+time+'</div><div class="status">'+(b?'已预约，点击查看':selected.includes(i)?'已选择':'空闲')+'</div>';btn.onclick=()=>{if(b){showBookingDetail(dayBookings.find(v=>bookingSlots(v.x).includes(i))?.x,time);return}hideBookingDetail();if(selected.includes(i))selected=selected.filter(x=>x!==i);else selected.push(i);selected.sort((a,b)=>a-b);render()};grid.appendChild(btn)});updateSummary();renderRecent()}
    function hideBookingDetail(){const detail=document.getElementById('bookingDetail');detail.classList.remove('show');detail.innerHTML=''}
    function showBookingDetail(booking,time){const detail=document.getElementById('bookingDetail');detail.innerHTML='<strong>预约申请详情 · '+time+'</strong><p><b>助理需求：</b>'+(booking&&booking.assistant?'需要助理':'不需要助理')+'</p><p><b>申请原因：</b>'+(booking&&booking.reason?escapeHtml(booking.reason):'未填写')+'</p>';detail.classList.add('show')}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function updateSummary(){const time=document.getElementById('summaryTime');if(!selected.length){time.textContent='尚未选择';return}time.textContent=selected.map(i=>slots[i]).join('、')}
    const ownerTokens=()=>JSON.parse(localStorage.getItem('bookingOwnerTokens')||'{}');
    const saveOwnerToken=(id,token)=>{const map=ownerTokens();map[id]=token;localStorage.setItem('bookingOwnerTokens',JSON.stringify(map))};
    function canManage(x){return !cloudReady||isStaff||!!ownerTokens()[x.id]}
    function renderRecent(){const list=document.getElementById('recentList'),data=getBookings();list.innerHTML=data.length?data.map((x,index)=>({x,index})).slice(-8).reverse().map(({x,index})=>'<div class="request-item '+(x.cancelled?'is-cancelled':'')+'"><div><strong>'+escapeHtml(x.studio)+' · '+escapeHtml(x.date)+'</strong><small>'+escapeHtml(x.time)+(x.assistant?' · 已申请助理':'')+'</small>'+(!x.cancelled&&canManage(x)?'<div class="request-actions"><button type="button" data-edit="'+index+'">修改</button><button type="button" class="cancel" data-cancel="'+index+'">取消预约</button></div>':'')+'</div><span class="tag">'+(x.cancelled?'已恢复可预约':'预约成功')+'</span></div>').join(''):'<p class="sub">还没有预约记录，选一个时间开始吧。</p>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editBooking(Number(b.dataset.edit)));list.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelBooking(Number(b.dataset.cancel)))}
    function editBooking(index){const data=getBookings(),x=data[index];if(!x||x.cancelled)return;const match=String(x.date).match(/(\d+)年(\d+)月(\d+)日/);if(!match)return;editingIndex=index;studioIndex=Math.max(0,studios.findIndex(s=>s.name===x.studio));selectedDate=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));selected=bookingSlots(x);document.querySelector('input[name="assistant"][value="'+(x.assistant?'yes':'no')+'"]').checked=true;document.getElementById('reasonWrap').classList.toggle('show',!!x.assistant);document.getElementById('reason').value=x.reason||'';document.getElementById('note').value=x.note||'';document.querySelector('#bookingForm .btn.primary').textContent='保存修改';const notice=document.getElementById('notice');notice.textContent='正在修改预约，调整后点击“保存修改”。';notice.style.background='#eef3ed';notice.style.color='#426750';notice.classList.add('show');render();document.getElementById('bookingForm').scrollIntoView({behavior:'smooth',block:'center'})}
    async function cancelBooking(index){const data=getBookings(),x=data[index];if(!x||x.cancelled||!window.confirm('确定取消 '+x.studio+' '+x.date+' 的预约吗？原时间段将恢复可预约。'))return;if(cloudReady){try{await api('/api/bookings/'+x.id,{method:'DELETE',headers:{'x-owner-token':ownerTokens()[x.id]||''}});await loadCloud()}catch(error){setSync('取消失败：'+error.message,true);return}}else{x.cancelled=true;localStorage.setItem('studioBookings',JSON.stringify(data))}if(editingIndex===index){editingIndex=null;selected=[];document.getElementById('bookingForm').reset();document.getElementById('reasonWrap').classList.remove('show');document.querySelector('#bookingForm .btn.primary').textContent='提交预约申请'}const notice=document.getElementById('notice');notice.textContent='预约已取消，原时间段已恢复可预约。';notice.style.background='#eef3ed';notice.style.color='#426750';notice.classList.add('show');render()}
    document.getElementById('prev').onclick=()=>{selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth()-1,1);selected=[];render()};document.getElementById('next').onclick=()=>{selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth()+1,1);selected=[];render()};
    document.querySelectorAll('input[name="assistant"]').forEach(r=>r.onchange=()=>document.getElementById('reasonWrap').classList.toggle('show',r.value==='yes'&&r.checked));
    document.getElementById('clearBtn').onclick=()=>{selected=[];document.getElementById('bookingForm').reset();document.getElementById('reasonWrap').classList.remove('show');document.getElementById('notice').classList.remove('show');render()};
    document.getElementById('bookingForm').onsubmit=async e=>{e.preventDefault();const notice=document.getElementById('notice'),assist=document.querySelector('input[name="assistant"]:checked').value,reason=document.getElementById('reason').value.trim();if(!selected.length){notice.textContent='请先选择至少一个空闲时间段。';notice.style.background='#fff0e5';notice.style.color='#a34f22';notice.classList.add('show');return}if(assist==='yes'&&!reason){notice.textContent='请填写需要助理的申请原因。';notice.style.background='#fff0e5';notice.style.color='#a34f22';notice.classList.add('show');document.getElementById('reason').focus();return}const data=getBookings(),time=selected.map(i=>slots[i]).join('、'),payload={studio:studios[studioIndex].name,booking_date:dbDate(selectedDate),slots:[...selected],assistant:assist==='yes',reason,note:document.getElementById('note').value.trim()};if(cloudReady){try{if(editingIndex!==null&&data[editingIndex]&&!data[editingIndex].cancelled){const x=data[editingIndex];await api('/api/bookings/'+x.id,{method:'PUT',headers:{'x-owner-token':ownerTokens()[x.id]||''},body:JSON.stringify(payload)});notice.textContent='预约修改已保存，新的时间段已锁定。'}else{const result=await api('/api/bookings',{method:'POST',body:JSON.stringify(payload)});saveOwnerToken(result.id,result.ownerToken);notice.textContent='预约成功，所选时间已同步并锁定。'}await loadCloud()}catch(error){notice.textContent='保存失败：'+error.message;notice.style.background='#ffe0cf';notice.style.color='#9c3f2d';notice.classList.add('show');return}}else{const localPayload={...payload,date:fullDate(selectedDate),time};if(editingIndex!==null&&data[editingIndex]&&!data[editingIndex].cancelled){data[editingIndex]={...data[editingIndex],...localPayload};notice.textContent='预约修改已保存，新的时间段已锁定。'}else{data.push(localPayload);notice.textContent='预约成功，所选时间已标红并锁定。'}localStorage.setItem('studioBookings',JSON.stringify(data))}editingIndex=null;document.querySelector('#bookingForm .btn.primary').textContent='提交预约申请';selected=[];notice.style.background='#eaf6ed';notice.style.color='#3d7451';notice.classList.add('show');render()};
    document.getElementById('staffLogin').onsubmit=async e=>{e.preventDefault();if(!cloudReady){setSync('部署到 Cloudflare 后可登录',true);return}const password=document.getElementById('staffPassword').value;setSync('正在登录…');try{await api('/api/staff/login',{method:'POST',body:JSON.stringify({password})});staffPassword=password;applyStaff(true);render()}catch(error){setSync('登录失败：'+error.message,true)}};
    document.getElementById('staffLogout').onclick=()=>{staffPassword='';applyStaff(false);setSync('已退出工作人员模式');render()};
    render();initCloud();
  </script>
</body>
</html>
